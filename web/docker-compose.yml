# 개발:  docker compose up dev    → http://localhost:5173 (HMR)
# 배포판 확인: docker compose up web → http://localhost:8080
services:
  dev:
    image: node:22-alpine
    working_dir: /app
    volumes:
      - .:/app
      # node_modules는 리눅스용 네이티브 바이너리라 호스트와 분리 (named volume)
      - node_modules:/app/node_modules
    command: sh -c "npm install && npm run dev -- --host"
    ports:
      - "5173:5173"

  web:
    build:
      context: .
      args:
        SITE_URL: ${SITE_URL:-}
    ports:
      - "8080:80"

volumes:
  node_modules:
